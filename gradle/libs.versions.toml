[versions]
activityKtx = "1.12.4"
agp = "8.13.2"
fragmentKtx = "1.8.9"
kotlin = "2.3.10"
cameraview = "2.7.2"
colorpickerview = "2.4.0"
documentfile = "1.1.0"
